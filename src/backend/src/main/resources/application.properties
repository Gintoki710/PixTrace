# Server Port
server.port=8080

# Application Name
spring.application.name=AI Image Forgery Detection System

# Multipart / File Upload Limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Database Configuration (Defaults to H2 for instant run, ready for MySQL)
spring.datasource.url=jdbc:h2:file:./data/forgery_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (for viva demonstration of database tables at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Alternative (Uncomment to switch to MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/forgery_detection_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root123
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Python FastAPI Microservice Integration
ai.service.url=http://127.0.0.1:8000/api/v1
ai.service.connect-timeout-ms=3000
ai.service.read-timeout-ms=8000

# Security & JWT Configuration
jwt.secret=9a3b6c8d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b
jwt.expiration-ms=86400000

# Static Resources
spring.web.resources.static-locations=classpath:/static/

